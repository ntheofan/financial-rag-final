name: Static pipeline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pipeline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate pipeline contract
        run: python -m unittest discover -s tests -v
